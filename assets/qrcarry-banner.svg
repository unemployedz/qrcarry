<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">QR Carry</title>
  <desc id="desc">Scan, decode and go. QR Carry banner.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090d"/><stop offset="1" stop-color="#101522"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#75b9ff"/><stop offset="1" stop-color="#1268ff"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1400" height="520" rx="32" fill="url(#bg)"/>
  <rect x="24" y="24" width="1352" height="472" rx="26" fill="url(#grid)" stroke="#ffffff" stroke-opacity=".06"/>
  <circle cx="1280" cy="-30" r="260" fill="#0d4cff" fill-opacity=".12"/>
  <circle cx="80" cy="560" r="280" fill="#0d4cff" fill-opacity=".12"/>
  <g transform="translate(105 108)">
    <rect width="270" height="270" rx="52" fill="#090d15" stroke="url(#blue)" stroke-width="7" filter="url(#glow)"/>
    <g fill="none" stroke="url(#blue)" stroke-width="18" stroke-linecap="round">
      <path d="M65 112V65h47M158 65h47v47M65 158v47h47M205 158v47h-47"/>
    </g>
    <g fill="#f7f9fc">
      <rect x="77" y="77" width="38" height="38" rx="7"/><rect x="155" y="77" width="38" height="38" rx="7"/>
      <rect x="77" y="155" width="38" height="38" rx="7"/><rect x="155" y="155" width="38" height="38" rx="7"/>
    </g>
  </g>
  <text x="430" y="220" font-family="Inter,Arial,sans-serif" font-size="108" font-weight="800" fill="#f7f9fc">QR</text>
  <text x="625" y="220" font-family="Inter,Arial,sans-serif" font-size="108" font-weight="800" fill="url(#blue)">Carry</text>
  <text x="435" y="278" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="600" fill="#aeb7c7">Scan. Decode. Go.</text>
  <g font-family="Inter,Arial,sans-serif" font-size="25" font-weight="650" fill="#dbe3ef">
    <text x="435" y="390">▦  Decode QR</text><text x="700" y="390">⌾  Scan Live</text><text x="970" y="390">ϟ  Fast &amp; Simple</text>
  </g>
  <path d="M655 365v48M925 365v48" stroke="#ffffff" stroke-opacity=".14" stroke-width="2"/>
</svg>
