<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>QR Tool</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div class="tabs">
      <button class="tab-btn active" data-tab="upload">Upload</button>
      <button class="tab-btn" data-tab="scan">Scan</button>
    </div>

    <div id="upload" class="tab-content active">
      <div class="upload-area" id="uploadArea">
        <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="17 8 12 3 7 8" />
          <line x1="12" y1="3" x2="12" y2="15" />
        </svg>
        <p>Upload QR code image</p>
        <input type="file" id="fileInput" accept="image/*" />
      </div>
      <div id="uploadResult" class="result-panel hidden">
        <div class="result-header">
          <span class="result-badge" id="resultBadge">URL</span>
          <span class="result-origin" id="resultOrigin">example.com</span>
        </div>
        <div class="result-body">
          <div class="result-row">
            <span class="label">Seed / Content</span>
            <span class="mono" id="resultSeed">-</span>
          </div>
          <div class="result-row">
            <span class="label">Full text</span>
            <span class="mono small" id="resultFull">-</span>
          </div>
        </div>
        <div class="result-actions">
          <button id="copyBtn" class="copy-btn">Copy seed</button>
          <span id="copyStatus" class="copy-status hidden">Copied</span>
        </div>
      </div>
    </div>

    <div id="scan" class="tab-content">
      <div class="scan-container">
        <video id="video" autoplay playsinline></video>
        <canvas id="scanOverlay" class="scan-overlay"></canvas>
        <div id="scanStatus">Point camera at QR code</div>
      </div>
      <div id="scanResult" class="result-panel hidden">
        <div class="result-header">
          <span class="result-badge" id="scanBadge">URL</span>
          <span class="result-origin" id="scanOrigin">example.com</span>
        </div>
        <div class="result-body">
          <div class="result-row">
            <span class="label">Seed / Content</span>
            <span class="mono" id="scanSeed">-</span>
          </div>
          <div class="result-row">
            <span class="label">Full text</span>
            <span class="mono small" id="scanFull">-</span>
          </div>
        </div>
        <div class="result-actions">
          <button id="scanCopyBtn" class="copy-btn">Copy seed</button>
          <span id="scanCopyStatus" class="copy-status hidden">Copied</span>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script src="script.js"></script>
</body>
</html>
